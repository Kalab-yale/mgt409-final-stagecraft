<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stagecraft · Event planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Ctext x='16' y='22' font-family='-apple-system,Helvetica,Arial' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <script src="/static/ui/theme-boot.js?v={{ app_version }}"></script>
  <link rel="stylesheet" href="/static/ui/app.css?v={{ app_version }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Stagecraft home"><span class="brand-mark">S</span> Stagecraft</a>
    <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
    <div class="spacer"></div>
    <span class="muted small" id="today" data-signed-in hidden></span>
    <div id="bell-slot" data-signed-in hidden></div>
    <div id="user-slot"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/ui/main.js?v={{ app_version }}"></script>
</body>
</html>
